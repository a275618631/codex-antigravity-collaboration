[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-local-codex-handoff"
version = "0.1.0"
description = "Minimal private GitHub inbox receiver for local Codex execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
github-handoff = "github_handoff.cli:main"

[tool.setuptools]
packages = ["github_handoff"]

[tool.setuptools.package-data]
github_handoff = ["*.json", "*.md"]
